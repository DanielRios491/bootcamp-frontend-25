<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css_grid.css">
    <title>Css Grid Challenge</title>
</head>
<body>
    <div class="outer-grid">
        <div class="outer-item">
            <div class="inner-grid">
                <div class="inner-item">
                    <div class="level-3-left">
                        <div class="item a">A</div>
                        <div class="item b">B</div>
                        <div class="item c">C</div>
                        <div class="item d">D</div>
                    </div>
                </div>
                <div class="inner-item">
                    <div class="level-3-center">
                        <div class="item">A</div>
                        <div class="item">B</div>
                        <div class="item">C</div>
                        <div class="item">D</div>
                        <div class="item">E</div>
                        <div class="item">F</div>
                        <div class="item">G</div>
                        <div class="item">H</div>
                        <div class="item">I</div>
                        <div class="item">J</div>
                    </div>
                </div>
                <div class="inner-item">
                    <div class="level-3-right">
                        <div class="item e">A</div>
                        <div class="item f">B</div>
                        <div class="item g">C</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="outer-item">
            <div class="inner-grid">
                <div class="inner-item">
                    <div class="level-3-left">
                        <div class="item a"></div>
                        <div class="item b"></div>
                        <div class="item c1"></div>
                    </div>
                </div>
                <div class="inner-item">
                    <div class="level-3-center">
                        <div class="item">A</div>
                        <div class="item">B</div>
                        <div class="item">C</div>
                        <div class="item">D</div>
                        <div class="item">E</div>
                        <div class="item">F</div>
                        <div class="item">G</div>
                        <div class="item">H</div>
                        <div class="item">I</div>
                        <div class="item">J</div>
                    </div>
                </div>
                <div class="inner-item">
                    <div class="level-3-right">
                        <div class="item d1">D</div>
                        <div class="item e1">A</div>
                        <div class="item f1">B</div>
                        <div class="item g1">C</div>
                    </div>
                </div>
        </div>
    </div>

</body>
</html>
